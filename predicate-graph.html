const canvas = document.getElementById('c');

//  GRAPH INTERNALS
// ═══════════════════════════════════════════════════════════════
const nodeMap = {};
NODES.forEach(n => { nodeMap[n.id] = n; });

const degree = {};
NODES.forEach(n => { degree[n.id] = 0; });
const validEdges = EDGES.filter(([a,b]) => nodeMap[a] && nodeMap[b]);
validEdges.forEach(([a,b]) => { degree[a]++; degree[b]++; });

document.getElementById('nodecount').textContent =
  `${NODES.length} nodes · ${validEdges.length} edges`;

// Seed positions
NODES.forEach((n, i) => {
  if (n.id === 'Predicate') { n.x = W/2; n.y = H/2; }
  else {
    const angle = (i / NODES.length) * Math.PI * 2 + i * 0.618;
    const band  = [160,250,340,420][i % 4];
    n.x = W/2 + Math.cos(angle) * (band + Math.random()*50);
    n.y = H/2 + Math.sin(angle) * (band + Math.random()*50);
  }
  n.vx = 0; n.vy = 0;
});

const CFG = {spring:0.013, repel:5800, damp:0.80, rest:125, gravity:0.0016};

function simulate(){
  for (let i = 0; i < NODES.length; i++){
    for (let j = i+1; j < NODES.length; j++){
      const a=NODES[i], b=NODES[j];
      const dx=a.x-b.x, dy=a.y-b.y;
      const d2=dx*dx+dy*dy+0.01;
      const f=CFG.repel/d2;
      a.vx+=f*dx; a.vy+=f*dy; b.vx-=f*dx; b.vy-=f*dy;
    }
  }
  validEdges.forEach(([ia,ib])=>{
    const a=nodeMap[ia], b=nodeMap[ib];
    const dx=b.x-a.x, dy=b.y-a.y;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    const f=(d-CFG.rest)*CFG.spring;
    const fx=(dx/d)*f, fy=(dy/d)*f;
    a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
  });
  NODES.forEach(n=>{
    n.vx+=(W/2-n.x)*CFG.gravity;
    n.vy+=(H/2-n.y)*CFG.gravity;
    n.vx*=CFG.damp; n.vy*=CFG.damp;
    n.x+=n.vx; n.y+=n.vy;
  });
}

// ─── Pan / zoom ────────────────────────────────────────────────
let pan={x:0,y:0}, scale=1, drag=false, last=null, hovered=null;

canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  scale=Math.min(6,Math.max(0.12,scale*(e.deltaY<0?1.12:0.89)));
},{passive:false});

canvas.addEventListener('mousedown',e=>{drag=true;last={x:e.clientX,y:e.clientY};});
addEventListener('mouseup',()=>{drag=false;});
canvas.addEventListener('mousemove',e=>{
  if(drag&&last){pan.x+=e.clientX-last.x;pan.y+=e.clientY-last.y;last={x:e.clientX,y:e.clientY};}
  const mx=(e.clientX-pan.x-W/2)/scale+W/2;
  const my=(e.clientY-pan.y-H/2)/scale+H/2;
  hovered=null;
  NODES.forEach(n=>{
    if(Math.hypot(n.x-mx,n.y-my)<rad(n)+5) hovered=n;
  });
  const tip=document.getElementById('tooltip');
  if(hovered){
    const col=G[hovered.g]?.color||'#aaa';
    tip.style.display='block';
    tip.style.left=(e.clientX+18)+'px';
    tip.style.top=(e.clientY-14)+'px';
    tip.querySelector('.tid').style.color=col;
    tip.querySelector('.tid').textContent=hovered.id;
    tip.querySelector('.tcat').style.color=col;
    tip.querySelector('.tcat').textContent=G[hovered.g]?.label||hovered.g;
    tip.querySelector('.tdesc').textContent=hovered.desc;
  } else { tip.style.display='none'; }
});

canvas.addEventListener('touchstart',e=>{drag=true;last={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
addEventListener('touchend',()=>{drag=false;});
canvas.addEventListener('touchmove',e=>{
  if(!drag||!last)return;
  pan.x+=e.touches[0].clientX-last.x;pan.y+=e.touches[0].clientY-last.y;
  last={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});

// ─── Node radius ───────────────────────────────────────────────
function rad(n){
  if(n.id==='Predicate') return 20;
  return 4.5 + Math.min(degree[n.id]||0, 14) * 1.4;
}

// ─── Highlight connected nodes ─────────────────────────────────
function connectedTo(id){
  const s=new Set([id]);
  validEdges.forEach(([a,b])=>{if(a===id)s.add(b);if(b===id)s.add(a);});
  return s;
}

// ─── Draw ──────────────────────────────────────────────────────
let tick=0;
function draw(){
  requestAnimationFrame(draw);
  if(tick<500){simulate();tick++;}

  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(pan.x+W/2,pan.y+H/2);
  ctx.scale(scale,scale);
  ctx.translate(-W/2,-H/2);

  const conn = hovered ? connectedTo(hovered.id) : null;

  // Edges
  validEdges.forEach(([ia,ib])=>{
    const a=nodeMap[ia],b=nodeMap[ib];
    const isHighlit = conn && (conn.has(ia)||conn.has(ib));
    const isCore    = ia==='Predicate'||ib==='Predicate';
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);
    if(conn){
      ctx.strokeStyle = isHighlit ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.02)';
      ctx.lineWidth   = isHighlit ? 1.4 : 0.5;
    } else {
      ctx.strokeStyle = isCore ? 'rgba(255,255,255,0.09)' : 'rgba(255,255,255,0.035)';
      ctx.lineWidth   = isCore ? 1.1 : 0.6;
    }
    ctx.stroke();
  });

  // Nodes
  NODES.forEach(n=>{
    const r   = rad(n);
    const col = G[n.g]?.color||'#888';
    const isCore = n.id==='Predicate';
    const dim    = conn && !conn.has(n.id);

    // Glow
    if(isCore){
      const grd=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,r*4);
      grd.addColorStop(0,'rgba(96,165,250,0.3)');
      grd.addColorStop(1,'rgba(96,165,250,0)');
      ctx.beginPath();ctx.arc(n.x,n.y,r*4,0,Math.PI*2);
      ctx.fillStyle=grd;ctx.fill();
    } else if(!dim && degree[n.id]>=5){
      const hex=col;
      ctx.beginPath();ctx.arc(n.x,n.y,r*2.2,0,Math.PI*2);
      ctx.fillStyle=hex+'22';ctx.fill();
    }

    // Circle
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);
    ctx.fillStyle = dim ? col+'44' : col;
    ctx.fill();

    // Label
    const fs = isCore ? 12 : 9.5;
    ctx.font      = isCore ? `bold ${fs}px sans-serif` : `${fs}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = dim ? 'rgba(255,255,255,0.15)' : (isCore?'#fff':'rgba(220,220,220,0.88)');
    ctx.fillText(n.id, n.x, n.y-r-4);
  });

  ctx.restore();
}

draw();
</script>
</body>
</html>
