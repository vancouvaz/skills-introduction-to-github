<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Predicate — Knowledge Graph</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0d0d0d;overflow:hidden;font-family:'SF Mono',Consolas,monospace}
    canvas{display:block;cursor:grab}
    canvas:active{cursor:grabbing}
    #title{
      position:absolute;top:18px;left:22px;pointer-events:none;
      color:#fff;font-size:22px;font-weight:700;letter-spacing:3px;line-height:1.3
    }
    #title span{
      display:block;font-size:11px;font-weight:400;letter-spacing:1px;
      color:#888;margin-top:2px
    }
    #tooltip{
      position:absolute;background:rgba(18,18,18,0.96);color:#e0e0e0;
      padding:7px 13px;border-radius:7px;font-size:12px;pointer-events:none;
      border:1px solid #333;display:none;max-width:260px;line-height:1.5;
      box-shadow:0 4px 20px rgba(0,0,0,0.6)
    }
    #tooltip b{color:#a0cfff;display:block;margin-bottom:2px}
    #legend{
      position:absolute;bottom:20px;left:22px;font-size:11px;line-height:2;
      pointer-events:none
    }
    .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
    #hint{position:absolute;bottom:20px;right:22px;color:#444;font-size:10px;text-align:right;pointer-events:none;line-height:1.8}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">PREDICATE<span>programmable compliance infrastructure · predicate.io</span></div>
<div id="tooltip"></div>
<div id="legend"></div>
<div id="hint">scroll to zoom<br>drag to pan<br>hover for details</div>

<script>
// ─── Colour groups ────────────────────────────────────────────────────────────
const GROUPS = {
  core:       { color:'#5bb8ff', label:'core platform' },
  product:    { color:'#4ecb71', label:'products' },
  compliance: { color:'#a78bfa', label:'compliance layer' },
  partner:    { color:'#fb923c', label:'customers & partners' },
  engineering:{ color:'#f472b6', label:'engineering' },
  ops:        { color:'#9ca3af', label:'operations & legal' },
  team:       { color:'#fbbf24', label:'team & investors' },
};

// ─── Nodes ────────────────────────────────────────────────────────────────────
const nodes = [
  // ── Core ──
  { id:'Predicate',             g:'core',        desc:'Programmable compliance infrastructure for onchain financial products. Policy-enforcement at the smart contract level.' },

  // ── Products ──
  { id:'Asset-Compliance',      g:'product',     desc:'Blacklisting sanctioned addresses from using tokens. Targeted at token issuers, stablecoin projects, and RWA platforms.' },
  { id:'Application-Compliance',g:'product',     desc:'Smart-contract policy enforcement for dApps: AML checks, rate limits, geofencing, collateral thresholds.' },
  { id:'Predicate-Identity',    g:'product',     desc:'KYC/KYB identity layer. Integrates multiple identity providers (SumSub, etc.) across chains without redeployments.' },
  { id:'Policy-Engine',         g:'product',     desc:'Declarative policy authoring via the Predicate Dashboard. Policies update dynamically without onchain redeployments.' },
  { id:'Predicate-Authority',   g:'product',     desc:'Pre-execution authority layer binding AI agent identity to deterministic state. Issues/revokes "work permits" to agents.' },

  // ── Compliance layer ──
  { id:'OFAC-Screening',        g:'compliance',  desc:'Real-time dynamic blacklist of OFAC sanctioned addresses. Operators build and maintain the list via EigenLayer AVS.' },
  { id:'AML-Gateway',           g:'compliance',  desc:'Automated anti-money laundering & CFT checks using TRM Labs risk scores integrated at the smart-contract level.' },
  { id:'KYC / KYB',             g:'compliance',  desc:'Seamless identity verification. Supports multiple providers; policies portable across EVM chains.' },
  { id:'Sanctions',             g:'compliance',  desc:'Configurable sanctions rules enforceable per jurisdiction, DAO, or corporate governance structure.' },
  { id:'Geofencing',            g:'compliance',  desc:'Jurisdictional restrictions — e.g. blocking US users from certain yield products for securities-law compliance.' },
  { id:'Rate-Limiting',         g:'compliance',  desc:'Configurable transaction volume & frequency controls per address, protocol, or time window.' },
  { id:'Collateral-Requirements',g:'compliance', desc:'Dynamic collateral validation for DeFi lending protocols — integrates offchain data into onchain rules.' },
  { id:'Attestations',          g:'compliance',  desc:'Cryptographic signatures issued by Predicate operators certifying a transaction meets policy. Replay-protected via UUID.' },

  // ── Infrastructure / Tech ──
  { id:'EigenLayer',            g:'partner',     desc:'Predicate runs as an AVS (Actively Validated Service) on EigenLayer. >$7B TVL shared security powers the operator network.' },
  { id:'Operators',             g:'compliance',  desc:'Distributed operator network (powered by EigenLayer PoS) that builds blacklists and issues policy attestations.' },

  // ── Partners & Customers ──
  { id:'TRM-Labs',              g:'partner',     desc:'Strategic partner. Provides industry-leading blockchain intelligence & risk scoring integrated into Predicate policies.' },
  { id:'Plume',                 g:'partner',     desc:'RWA-focused chain. Uses Predicate for bridge compliance — OFAC blacklist enforcement without altering UX or requiring KYC.' },
  { id:'Paxos',                 g:'partner',     desc:'Stablecoin issuer (USDG). Active predicate-paxos GitHub repo indicates deep technical compliance integration.' },
  { id:'LayerZero',             g:'partner',     desc:'Cross-chain interoperability. Paxos USDG0 uses LayerZero OFT standard; part of the regulated stablecoin ecosystem.' },
  { id:'Amina-Bank',            g:'partner',     desc:'Swiss FINMA-regulated crypto bank. Integrates Paxos USDG. Part of the institutional compliance ecosystem.' },
  { id:'CipherOwl',             g:'partner',     desc:'On-chain data & compliance provider. Integrated into Predicate\'s partner ecosystem for address risk data.' },
  { id:'MerkleScience',         g:'partner',     desc:'Blockchain analytics firm providing risk-scoring data usable as Predicate policy inputs.' },
  { id:'SumsubKYB',             g:'partner',     desc:'Identity verification provider (KYC/KYB) integrated via Predicate-Identity for compliant onboarding.' },
  { id:'Verulink',              g:'partner',     desc:'Cross-chain bridge on Aleo. Reduced attestation delay from 24h to 15min using Predicate policy infrastructure.' },
  { id:'Consensys',             g:'partner',     desc:'Ethereum ecosystem builder. Ecosystem overlap via EVM-native deployment and institutional DeFi focus.' },
  { id:'Solana',                g:'partner',     desc:'Target chain expansion. Predicate plans to extend beyond EVM to Solana and other L1s.' },
  { id:'Stellar',               g:'partner',     desc:'Payment-focused blockchain. Potential partner in the regulated asset tokenization space.' },
  { id:'Paxos',                 g:'partner',     desc:'Token issuer with compliance needs. Uses Predicate for regulated stablecoin policy enforcement.' },
  { id:'Token-Issuers',         g:'partner',     desc:'Primary customer segment: stablecoin and RWA token issuers needing blacklist and transfer-rule enforcement.' },
  { id:'Stablecoins',           g:'partner',     desc:'Key use case: USDG, regulated stablecoins requiring jurisdictional and sanctions compliance at the smart-contract level.' },
  { id:'RWA',                   g:'partner',     desc:'Real-World Assets onchain. Core market: tokenised securities, funds, and treasuries needing institutional compliance.' },
  { id:'DeFi',                  g:'partner',     desc:'DeFi protocols (vaults, LPs, restaking) use Predicate to block stolen/sanctioned assets from entering liquidity.' },
  { id:'AI-Agents',             g:'partner',     desc:'Emerging segment: Predicate-Authority governs AI agent transactions — guardrails, fraud prevention, intent validation.' },

  // ── Team & Investors ──
  { id:'Nikhil Raghuveera',     g:'team',        desc:'Co-Founder & CEO. Ex-Celo Foundation (Head of Strategy & Innovation), Atlantic Council Senior Fellow, Harvard Kennedy MPA.' },
  { id:'Jesse Sawa',            g:'team',        desc:'Co-Founder & CTO. Former JP Morgan software engineer. Leads engineering and technical architecture.' },
  { id:'Michael Mosier',        g:'team',        desc:'Advisor. Former Acting Director of US Treasury\'s FinCEN. Deep regulatory credibility for institutional adoption.' },
  { id:'Khushi Wadhwa',         g:'team',        desc:'Research & Strategy. Part of Predicate\'s 6-person founding team.' },
  { id:'1kx',                   g:'team',        desc:'Lead investor. Web3-native VC firm. Part of the $7M seed round announced October 2024.' },
  { id:'Tribe Capital',         g:'team',        desc:'Co-lead investor. $7M seed round. Growth-stage VC with fintech and crypto portfolio.' },

  // ── Engineering ──
  { id:'Rust',                  g:'engineering', desc:'Backend systems language used in Predicate operator and core infrastructure components.' },
  { id:'Solidity',              g:'engineering', desc:'Smart contract language. PredicateRegistry.sol and PredicateClient.sol enforce policies onchain.' },
  { id:'Backend',               g:'engineering', desc:'Off-chain operator services, policy API, and attestation generation infrastructure.' },
  { id:'Frontend',              g:'engineering', desc:'Predicate Dashboard — web UI for authoring, deploying, and monitoring compliance policies.' },
  { id:'DevOps',                g:'engineering', desc:'Deployment and infrastructure automation for the distributed operator network.' },
  { id:'Smart-Contracts',       g:'engineering', desc:'PredicateRegistry.sol (attester mgmt, UUID replay protection) + PredicateClient.sol (WHO + WHAT validation).' },

  // ── Ops & Legal ──
  { id:'Vision',                g:'ops',         desc:'Bring regulated markets fully onchain. Compliance as a plug-and-play layer, not a bottleneck to innovation.' },
  { id:'Roadmap',               g:'ops',         desc:'Phase 1: EVM chains. Phase 2: Expand to Solana and non-EVM L1s. Phase 3: AI-agent policy enforcement.' },
  { id:'GTM',                   g:'ops',         desc:'Go-to-market: white-glove integration with new clients. Revenue model: per-transaction fee charged to protocols.' },
  { id:'Pricing',               g:'ops',         desc:'Transaction-fee model. Predicate charges a fee per screened transaction, creating recurring protocol-level revenue.' },
  { id:'Docs',                  g:'ops',         desc:'docs.predicate.io — V2 documentation covering essentials, SDK, smart contract integration, and policy authoring.' },
  { id:'ADGM',                  g:'ops',         desc:'Abu Dhabi Global Market. Regulatory sandbox jurisdiction relevant to Predicate\'s expansion into MENA markets.' },
  { id:'Delaware',              g:'ops',         desc:'US incorporation jurisdiction. Standard for US-based blockchain startups seeking VC funding.' },
  { id:'FinCEN',                g:'ops',         desc:'US Treasury\'s Financial Crimes Enforcement Network. Michael Mosier (advisor) former Acting Director.' },
  { id:'Security-Audit',        g:'ops',         desc:'Smart contract audits and security review of PredicateRegistry and PredicateClient contracts.' },
  { id:'BD',                    g:'ops',         desc:'Business development: institutional outreach to banks, DeFi protocols, stablecoin issuers, and RWA platforms.' },
];

// Deduplicate Paxos (accidentally added twice)
const seen = new Set();
const dedupedNodes = nodes.filter(n => {
  if (seen.has(n.id)) return false;
  seen.add(n.id);
  return true;
});

// ─── Edges ────────────────────────────────────────────────────────────────────
const edges = [
  // Core → Products
  ['Predicate','Asset-Compliance'],
  ['Predicate','Application-Compliance'],
  ['Predicate','Predicate-Identity'],
  ['Predicate','Policy-Engine'],
  ['Predicate','Predicate-Authority'],

  // Core → Compliance
  ['Predicate','OFAC-Screening'],
  ['Predicate','AML-Gateway'],
  ['Predicate','KYC / KYB'],
  ['Predicate','Sanctions'],
  ['Predicate','EigenLayer'],
  ['Predicate','Operators'],
  ['Predicate','Attestations'],

  // Core → Partners
  ['Predicate','TRM-Labs'],
  ['Predicate','Plume'],
  ['Predicate','Paxos'],
  ['Predicate','LayerZero'],
  ['Predicate','Amina-Bank'],
  ['Predicate','CipherOwl'],
  ['Predicate','MerkleScience'],
  ['Predicate','SumsubKYB'],
  ['Predicate','Verulink'],
  ['Predicate','Consensys'],
  ['Predicate','Solana'],
  ['Predicate','Stellar'],
  ['Predicate','Token-Issuers'],
  ['Predicate','RWA'],
  ['Predicate','DeFi'],
  ['Predicate','AI-Agents'],
  ['Predicate','Stablecoins'],

  // Core → Team
  ['Predicate','Nikhil Raghuveera'],
  ['Predicate','Jesse Sawa'],
  ['Predicate','1kx'],
  ['Predicate','Tribe Capital'],

  // Core → Ops
  ['Predicate','Vision'],
  ['Predicate','Roadmap'],
  ['Predicate','GTM'],
  ['Predicate','Pricing'],
  ['Predicate','Docs'],
  ['Predicate','Security-Audit'],
  ['Predicate','BD'],

  // Core → Eng
  ['Predicate','Rust'],
  ['Predicate','Solidity'],
  ['Predicate','Backend'],
  ['Predicate','Frontend'],
  ['Predicate','DevOps'],
  ['Predicate','Smart-Contracts'],

  // Product ↔ Compliance cross-links
  ['Policy-Engine','OFAC-Screening'],
  ['Policy-Engine','AML-Gateway'],
  ['Policy-Engine','Sanctions'],
  ['Policy-Engine','Geofencing'],
  ['Policy-Engine','Rate-Limiting'],
  ['Policy-Engine','Collateral-Requirements'],
  ['Policy-Engine','Attestations'],
  ['Policy-Engine','Operators'],
  ['Asset-Compliance','OFAC-Screening'],
  ['Asset-Compliance','Sanctions'],
  ['Asset-Compliance','Token-Issuers'],
  ['Application-Compliance','AML-Gateway'],
  ['Application-Compliance','Rate-Limiting'],
  ['Application-Compliance','Geofencing'],
  ['Application-Compliance','DeFi'],
  ['Predicate-Identity','KYC / KYB'],
  ['Predicate-Identity','SumsubKYB'],
  ['Predicate-Authority','AI-Agents'],
  ['Predicate-Authority','Smart-Contracts'],

  // EigenLayer ↔ Operators
  ['EigenLayer','Operators'],
  ['Operators','Attestations'],

  // Partner cross-links
  ['TRM-Labs','AML-Gateway'],
  ['Plume','RWA'],
  ['Plume','OFAC-Screening'],
  ['Paxos','Stablecoins'],
  ['Paxos','LayerZero'],
  ['Amina-Bank','Paxos'],
  ['Amina-Bank','LayerZero'],
  ['MerkleScience','AML-Gateway'],
  ['CipherOwl','OFAC-Screening'],
  ['Verulink','Attestations'],

  // Team links
  ['Nikhil Raghuveera','Vision'],
  ['Jesse Sawa','Smart-Contracts'],
  ['Jesse Sawa','Backend'],
  ['Michael Mosier','FinCEN'],
  ['Michael Mosier','Sanctions'],
  ['1kx','Tribe Capital'],

  // Ops cross-links
  ['ADGM','Vision'],
  ['Delaware','Vision'],
  ['FinCEN','OFAC-Screening'],
  ['Security-Audit','Smart-Contracts'],
  ['GTM','BD'],
  ['Pricing','GTM'],
  ['Docs','Policy-Engine'],
  ['Roadmap','Solana'],
  ['Roadmap','AI-Agents'],

  // Eng cross-links
  ['Rust','Backend'],
  ['Rust','Operators'],
  ['Solidity','Smart-Contracts'],
  ['Frontend','Policy-Engine'],
  ['DevOps','Backend'],

  // Extra compliance nodes (not connected to core yet)
  ['Predicate','Geofencing'],
  ['Predicate','Rate-Limiting'],
  ['Predicate','Collateral-Requirements'],
  ['Predicate','Michael Mosier'],
  ['Predicate','Khushi Wadhwa'],
  ['Predicate','ADGM'],
  ['Predicate','Delaware'],
  ['Predicate','FinCEN'],
];

// ─── Canvas setup ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const tip    = document.getElementById('tooltip');
let W, H;
function resize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

// Build legend
const leg = document.getElementById('legend');
leg.innerHTML = Object.entries(GROUPS).map(([k,v])=>
  `<div><span class="dot" style="background:${v.color}"></span><span style="color:${v.color}">${v.label}</span></div>`
).join('');

// ─── Node map & degree ────────────────────────────────────────────────────────
const nodeMap = {};
dedupedNodes.forEach(n => { nodeMap[n.id] = n; });
const degree = {};
dedupedNodes.forEach(n => (degree[n.id] = 0));
edges.forEach(([a,b]) => {
  if (nodeMap[a] && nodeMap[b]) { degree[a]++; degree[b]++; }
});

// ─── Initial positions (seeded spiral) ───────────────────────────────────────
dedupedNodes.forEach((n, i) => {
  if (n.id === 'Predicate') { n.x = W/2; n.y = H/2; }
  else {
    const angle = (i / dedupedNodes.length) * Math.PI * 2 + i * 0.3;
    const r     = 160 + (i % 5) * 60 + Math.random() * 60;
    n.x = W/2 + Math.cos(angle) * r;
    n.y = H/2 + Math.sin(angle) * r;
  }
  n.vx = 0; n.vy = 0;
});

// ─── Force simulation ─────────────────────────────────────────────────────────
const SPRING_K   = 0.014;
const REPEL      = 5500;
const DAMPING    = 0.80;
const TARGET_LEN = 130;

function simulate(){
  // Repulsion
  for (let i = 0; i < dedupedNodes.length; i++){
    for (let j = i+1; j < dedupedNodes.length; j++){
      const a = dedupedNodes[i], b = dedupedNodes[j];
      const dx = a.x-b.x, dy = a.y-b.y;
      const d2 = dx*dx + dy*dy + 0.01;
      const f  = REPEL / d2;
      const fx = f*dx, fy = f*dy;
      a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
    }
  }
  // Springs
  edges.forEach(([idA,idB]) => {
    const a = nodeMap[idA], b = nodeMap[idB];
    if (!a || !b) return;
    const dx = b.x-a.x, dy = b.y-a.y;
    const d  = Math.sqrt(dx*dx+dy*dy) || 1;
    const f  = (d - TARGET_LEN) * SPRING_K;
    const fx = (dx/d)*f, fy = (dy/d)*f;
    a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
  });
  // Gravity toward center
  dedupedNodes.forEach(n => {
    n.vx += (W/2 - n.x) * 0.0018;
    n.vy += (H/2 - n.y) * 0.0018;
    n.vx *= DAMPING; n.vy *= DAMPING;
    n.x  += n.vx;    n.y  += n.vy;
  });
}

// ─── Pan / zoom ───────────────────────────────────────────────────────────────
let pan = {x:0, y:0}, scale = 1;
let drag = false, last = null;

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.12 : 0.89;
  scale = Math.min(5, Math.max(0.15, scale * f));
}, {passive:false});

canvas.addEventListener('mousedown', e => { drag=true; last={x:e.clientX,y:e.clientY}; });
addEventListener('mouseup',   () => { drag=false; });
canvas.addEventListener('mousemove', e => {
  if (drag && last){
    pan.x += e.clientX-last.x;
    pan.y += e.clientY-last.y;
    last = {x:e.clientX,y:e.clientY};
  }
  // Tooltip hit test
  const mx = (e.clientX - pan.x - W/2)/scale + W/2;
  const my = (e.clientY - pan.y - H/2)/scale + H/2;
  let hit = null;
  dedupedNodes.forEach(n => {
    const dx=n.x-mx, dy=n.y-my;
    if (Math.sqrt(dx*dx+dy*dy) < radius(n)+6) hit=n;
  });
  if (hit){
    tip.style.display='block';
    tip.style.left=(e.clientX+16)+'px';
    tip.style.top =(e.clientY-12)+'px';
    tip.innerHTML=`<b>${hit.id}</b>${hit.desc}`;
  } else { tip.style.display='none'; }
});

// Touch
canvas.addEventListener('touchstart', e=>{drag=true;last={x:e.touches[0].clientX,y:e.touches[0].clientY};});
addEventListener('touchend',()=>{drag=false;});
canvas.addEventListener('touchmove', e=>{
  if(!drag||!last)return;
  pan.x+=e.touches[0].clientX-last.x;
  pan.y+=e.touches[0].clientY-last.y;
  last={x:e.touches[0].clientX,y:e.touches[0].clientY};
});

// ─── Node radius ──────────────────────────────────────────────────────────────
function radius(n){
  if (n.id==='Predicate') return 18;
  return 5 + Math.min(degree[n.id]||0, 12) * 1.5;
}

// ─── Draw ─────────────────────────────────────────────────────────────────────
let tick = 0;
const SIMULATE_TICKS = 400;

function draw(){
  requestAnimationFrame(draw);
  if (tick < SIMULATE_TICKS){ simulate(); tick++; }

  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(pan.x + W/2, pan.y + H/2);
  ctx.scale(scale, scale);
  ctx.translate(-W/2, -H/2);

  // Edges
  edges.forEach(([idA,idB]) => {
    const a=nodeMap[idA], b=nodeMap[idB];
    if(!a||!b)return;
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);
    const isMajor = idA==='Predicate'||idB==='Predicate';
    ctx.strokeStyle = isMajor ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.04)';
    ctx.lineWidth = isMajor ? 1.2 : 0.7;
    ctx.stroke();
  });

  // Nodes
  dedupedNodes.forEach(n => {
    const r   = radius(n);
    const col = GROUPS[n.g]?.color || '#888';
    const isCore = n.id==='Predicate';

    // Glow
    if (isCore){
      const grd = ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,r*3.5);
      grd.addColorStop(0,'rgba(91,184,255,0.25)');
      grd.addColorStop(1,'rgba(91,184,255,0)');
      ctx.beginPath();
      ctx.arc(n.x,n.y,r*3.5,0,Math.PI*2);
      ctx.fillStyle=grd;
      ctx.fill();
    } else if (degree[n.id] >= 6){
      const grd = ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,r*2.5);
      grd.addColorStop(0,col.replace(')',',0.15)').replace('rgb','rgba'));
      grd.addColorStop(1,'rgba(0,0,0,0)');
      ctx.beginPath();
      ctx.arc(n.x,n.y,r*2.5,0,Math.PI*2);
      ctx.fillStyle=grd;
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(n.x,n.y,r,0,Math.PI*2);
    ctx.fillStyle=col;
    ctx.fill();

    // Label
    const fontSize = isCore ? 13 : Math.max(9, 10);
    ctx.font      = isCore ? `bold ${fontSize}px sans-serif` : `${fontSize}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = isCore ? '#ffffff' : '#cccccc';
    ctx.fillText(n.id, n.x, n.y - r - 4);
  });

  ctx.restore();
}

draw();
</script>
</body>
</html>
